# Released checkpoint smol_3000t_s1236 (tier2, archive syntra_weights_tier2_part2.tar): the training config of run
# smol_curve_nocap_3000t_s1236 as logged at its start, with root_dir made relative to the data release.
# TEST scores the test pairing at the training k (paper: 82.32 mIoU). Weights: tier2/smol_3000t_s1236.safetensors
# SMOL baseline: prompts come from source_file; TEST scores test_samples.txt (target_file is reset
# there because test.py would otherwise inherit TRAIN's target_file, the selection itself).
TRAIN:
  task_name: smol_curve_nocap_3000t_s1236
  root_dir: data
  data_info: sample_pair_budget_random_gap0_3000t_s2026_budget_random_gap0_3000t_s2026_gap0
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  vis_freq: null
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default
  src_fusion: max
  dataset_name: smol
  num_src: 1
  num_notions: 1
  img_size: 384
  foreground_ratio: 0.05
  sampler: group_fixed_m
  data_keywords: hismap,siegfried
  exclude_keys: null
  validation_data: null
  val_interval: 2000
  uni_transform:
  - name: ToTensor
  - name: Resize
    args:
      target_size: 384
  - name: Normalize
    args:
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.25
      - 0.25
      - 0.25
  aug_transform:
  - name: RandomRotateBatch
    args:
      degrees: 30
  num_epochs: 200
  max_iterations: 100000
  lr: 0.001
  lr_scheduler: exp
  output_dir: logs
  disable_runid: true
  weight_decay: 0.01
  warmup_itrs: 1000
  resume: null
  ce_neg_weight: 1.0
  pos_prob: 0.5
  source_file: budget_random_gap0_3000t_s2026.json
  target_file: budget_random_gap0_3000t_s2026.json
  seed: 1236
  src_fg_max: .inf
TEST:
  num_notions: 1
  num_src: 1
  data_info: sample_pair_budget_random_gap0_3000t_s2026_test_samples_gap0
  data_keywords: hismap,siegfried
  exclude_keys: null
  checkpoint: null
  save_result: true
  output_dir: null
  target_file: test_samples.txt
