TRAIN:
  # common
  task_name: null # will be set to the config file name
  root_dir: /home/yuan/data/syntra/medical/medical.acdc
  data_info: pairing_cls_selection_50_cls_selection_50_intracls # pairing_train_samples_train_samples_intracls
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  # vis_freq: 10

  # model
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default

  # data
  dataset_name: cd_syntra
  num_src: 3
  num_notions: 1
  img_size: 384
  foreground_ratio: 0.0001
  sampler: group_fixed_m:3 # grouped_prob | uniform | prob
  data_keywords: acdc
  uni_transform:
    - name: ToTensor
    - name: Normalize
      args:
        mean: [0.5, 0.5, 0.5]
        std: [0.25, 0.25, 0.25]

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  warmup_iters: 1000
  output_dir: logs
  disable_runid: true

TEST:
  num_notions: 1
  num_src: 7
  data_info: pairing_train_samples_test_samples_intracls
  data_keywords: acdc
  checkpoint: null # will be set to the path ./output_dir/<task_name>/model_latest.pth
  save_result: true

