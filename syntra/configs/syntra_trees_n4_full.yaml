TRAIN:
  # common
  task_name: null # will be set to the config file name
  root_dir: /koko/datasets/syntra/forest_monitoring/trees
  data_info: pairing_train_samples_train_samples_intracls
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  vis_freq: 500

  # model
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default

  # data
  dataset_name: cd_syntra_efficient
  num_src: 3
  num_notions: 4
  img_size: 384
  foreground_ratio: 0.05
  sampler: group_fixed_m # grouped_prob | uniform | prob
  data_keywords: trees
  validation_data: null
  uni_transform:
    - name: ToTensor
    - name: Normalize
      args:
        mean: [0.5, 0.5, 0.5]
        std: [0.25, 0.25, 0.25]
  aug_transform:
    - name: RandomFlipBatch
      args:
        p_horizontal: 0.5
        p_vertical: 0.5
    - name: RandomRotateBatch
      args:
        degrees: 30

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  output_dir: logs
  disable_runid: true
  weight_decay: 0.01
  warmup_itrs: 1000
  resume: null


TEST:
  num_notions: 1
  num_src: 7
  data_info: pairing_train_samples_test_samples_intracls
  data_keywords: trees_september
  checkpoint: null # will be set to the path ./logs/<task_name>/model_latest.pth
  save_result: true
  output_dir: null # will be set to the checkpoint's parent directory

