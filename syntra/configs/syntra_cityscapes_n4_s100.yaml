TRAIN:
  # common
  task_name: syntra_cityscapes
  root_dir: /home/yuan/data/syntra/autonomous_driving
  data_info: pairing_cls_selection_100_cls_selection_100_intracls
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  # vis_freq: 2000

  # model
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default

  # data
  dataset_name: cd_syntra
  num_src: 3
  num_notions: 4
  foreground_ratio: 0.05
  sampler: group_fixed_m1 # grouped_prob | uniform | prob
  data_keywords: cityscapes

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  warmup_iters: 1000
  output_dir: logs
  disable_runid: true

TEST:
  num_notions: 1
  num_src: 7
  data_info: pairing_cls_selection_100_test_samples_intracls
  data_keywords: cityscapes
  checkpoint: logs/syntra_cityscapes/model_latest.pth
  save_result: true

