TRAIN:
  # common
  task_name: null # will be set to the config file name
  root_dir: /home/yuan/data/syntra/hismap
  data_info: pairing_cls_selection_100_cls_selection_100_intracls
  batch_size: 8
  num_workers: 8
  accum_steps: 4

  # model
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default

  # data
  dataset_name: cd_syntra
  num_src: 3
  num_notions: 4
  foreground_ratio: 0.05
  sampler: group_fixed_m1 # grouped_prob | uniform | prob
  # data-keywords: facies

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  warmup_iters: 1000
  output_dir: logs
  disable_runid: true

TEST:
  num_notions: 1
  num_src: 7
  data_info: pairing_cls_selection_100_test_samples_intracls
  data_keywords: null
  checkpoint: logs/syntra_hismap/model_latest.pth
  save_result: true
  output_dir: null # will be set to the checkpoint's parent directory

