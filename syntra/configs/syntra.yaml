

MODEL:
  model_name: SyntraModel
  dora_rank: 16
  backbone: hiera_bp
  prompt_encoder: example
  mask_decoder: highres

DATA:
  dataset_name: syntra
  root_dir: null
  data_info: pairing_train_100shot_train_100shot_intercls.json
  num_src: 3
  num_notions: 1
  foreground_ratio: 0.05
  sampler: grouped_prob # grouped_prob | uniform | prob

TRAIN:
  num_epochs: 200
  max_iterations: 100000
  batch_size: 8
  lr: 0.0001
  lr_scheduler: exp
  warmup_iters: 1000
  output_dir: ./logs

