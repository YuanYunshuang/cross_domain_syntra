TRAIN:
  # common
  task_name: null # will be set to the config file name
  root_dir: /home/yuan/data/syntra
  data_info: sample_pair_cls_selection_100_cls_selection_100_intracls
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  vis_freq: null  # disable visualization during training

  # model
  model_name: unet
  num_classes: 7

  # data
  dataset_name: unet
  img_size: 384
  data_keywords: hismap,siegfried
  sampler: group_fixed_m 
  uni_transform:
    - name: ToTensor
    - name: Resize
      args:
        target_size: 384
    - name: Normalize
      args:
        mean: [0.5, 0.5, 0.5]
        std: [0.25, 0.25, 0.25]
  aug_transform:
    - name: RandomRotateBatch
      args:
        degrees: 30

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  output_dir: logs
  disable_runid: true
  weight_decay: 0.01
  warmup_itrs: 1000
  resume: null
  ce_neg_weight: 1.0

TEST:
  data_info: sample_pair_cls_selection_100_test_samples_intracls
  data_keywords: hismap,siegfried
  checkpoint: null # will be set to the path ./logs/<task_name>/model_latest.pth
  save_result: true
  output_dir: null # will be set to the checkpoint's parent directory

