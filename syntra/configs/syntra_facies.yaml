TRAIN:
  # common
  task_name: syntra_facies
  root_dir: /home/yuan/data/syntra/geology
  data_info: pairing_train_train_intercls.json
  batch_size: 8
  num_workers: 8
  accum_steps: 4

  # model
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default

  # data
  dataset_name: syntra
  num_src: 3
  num_notions: 1
  foreground_ratio: 0.05
  sampler: uniform # grouped_prob | uniform | prob
  # data-keywords: facies

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  warmup_iters: 1000
  output_dir: syntra/logs/syntra_facies
  disable_runid: true

TEST:
  num_notions: 7
  num_src: 7
  data_info: pairing_train_test_intercls.json
  data_keywords: facies
  checkpoint: syntra/logs/syntra_facies/model_latest.pth
  save_result: true

