TRAIN:
  # common
  task_name: syntra_facies_trees
  root_dir: /home/yuan/data/syntra
  data_info: 
    pairing_train_train_intracls: ['geology/seismic_facies.f3']
    pairing_train_100shot_train_100shot_intracls: ['forest_monitoring/forest_monitoring.trees']
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  resume: logs/syntra_facies_trees/model_latest.pth
  vis_freq: 50

  # model
  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default

  # data
  dataset_name: cd_syntra
  num_src: 3
  num_notions: 1
  foreground_ratio: 0.05
  sampler: group_fixed_m1 # grouped_prob | uniform | prob | group_fixed_m[n]
  # data-keywords: facies

  # train
  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  warmup_iters: 1000
  output_dir: ./logs
  disable_runid: true

TEST:
  num_notions: 7
  num_src: 7
  data_info: pairing_train_test_intercls.json
  data_keywords: facies
  checkpoint: logs/syntra_facies_trees/model_latest.pth
  save_result: true

