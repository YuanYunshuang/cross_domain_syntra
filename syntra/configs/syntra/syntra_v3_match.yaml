# E13 under exactly the configuration that produced 85.89 mIoU, with the training data as the
# only variable.
#
# Copied field for field from the config recorded in the log of
#   /koko/SYNTRA_logs/syntra/syntra_hismap_n1_s100_v3
# whose main_results/test_model_latest_hismap.txt scores 85.89 over the nine (dataset, class)
# combinations of the full corpus, Siegfried included. Four settings differ from
# syntra_maps_s100.yaml and every one of them moved the number:
#
#   uni_transform      Resize is KEPT, and this is the one setting that cannot follow v3. v3 had
#                      no Resize because its corpus was the syntra_deprecated tree, where
#                      Siegfried had already been resampled to 384 on disk. The current corpus
#                      keeps Siegfried at its native 224 while hismap is 384, and collate_fn
#                      stacks a batch into one tensor, so without Resize the first batch mixing a
#                      railway tile with a hameln tile raises. The upsampling therefore happens
#                      in the loader rather than on disk - close to v3, not identical to it.
#   foreground_ratio   flat 0.05, as a scalar. The dict previously used was resolved
#                      inconsistently: fg_threshold in the data tools matches its key against the
#                      subset name, where 'siegfried' does not appear in 'railway', so selection
#                      and pairing used 0.05; cd_syntra2 matches against the full path, where it
#                      does, so the dataset used 0.01. One run, two thresholds. A scalar removes
#                      the ambiguity - 406 railway and 19 vineyard test tiles sit between 1% and
#                      5% coverage and were positives to the dataset and negatives to the tools.
#   use_amp            absent, so fp32. Section 4 of the old plan already warns that 85.89 is
#                      not comparable to an AMP run.
#   max_iterations     100,000, not the 150,000 the pilot suggested.
#
# hameln.3921_2023 is kept, as v3 kept it. It is the same scan as hameln.3921_2017 under a
# second year label (docs/DATA_ISSUE_hameln_3921_duplicate.md), so the corpus contains that
# sheet twice and both copies are trained on and scored. That is a known defect of the data
# rather than of this experiment, and excluding it here would be one more difference from the
# run being reproduced. v3 ran before the corpus was reorganised and its root held Siegfried
# under the hismap directory, so `data_keywords: hismap` covered everything; in the present
# layout that is `hismap,siegfried`.
TRAIN:
  task_name: null
  root_dir: /home/yuan/data/syntra
  data_info: sample_pair_cls_selection_100_cls_selection_100_intracls
  batch_size: 8
  num_workers: 8
  accum_steps: 4
  vis_freq: null

  model_name: smol
  dora_rank: 16
  backbone: vit_b
  prompt_encoder: example
  mask_decoder: default
  src_fusion: max

  dataset_name: cd_syntra2_efficient
  num_src: 3
  num_notions: 1
  img_size: 384
  src_selection: retrieved
  retrieval_encoder: dinov2
  foreground_ratio: 0.05
  sampler: group_fixed_m
  data_keywords: hismap,siegfried
  exclude_keys: null
  validation_data: null
  val_interval: 2000
  uni_transform:
    - name: ToTensor
    - name: Resize
      args:
        target_size: 384
    - name: Normalize
      args:
        mean: [0.5, 0.5, 0.5]
        std: [0.25, 0.25, 0.25]
  aug_transform:
    - name: RandomRotateBatch
      args:
        degrees: 30

  num_epochs: 200
  max_iterations: 100000
  lr: 1e-3
  lr_scheduler: exp
  output_dir: logs
  disable_runid: true
  weight_decay: 0.01
  warmup_itrs: 1000
  resume: null
  ce_neg_weight: 1.0

TEST:
  num_notions: 1
  num_src: 7
  data_info: sample_pair_cls_selection_100_test_samples_intracls
  data_keywords: hismap,siegfried
  exclude_keys: null
  checkpoint: null
  save_result: true
  output_dir: null
